name: 🌀 Create 'MeinVF' Release

on:
  workflow_dispatch:

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required permission to delete runs

    steps:
      - name: Delete all completed workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Starting cleanup of workflow runs for $GH_REPO"
          
          # We loop because the 'gh run list' command is paginated (max 100 per page)
          while true; do
            # Fetch a batch of run IDs (only completed)
            RUN_IDS=$(gh run list --repo $GH_REPO --status completed --limit 100 --json databaseId -q '.[].databaseId')

            # Exit loop if no runs are found (jq returns empty string)
            if [ -z "$RUN_IDS" ]; then
              echo "No more completed runs to delete."
              break
            fi

            echo "Found batch of runs to delete..."
            
            # Loop through IDs and delete
            for RUN_ID in $RUN_IDS; do
              echo "Deleting run: $RUN_ID"
              gh run delete $RUN_ID
              sleep 0.25 # Short sleep to avoid hitting API rate limits too hard
            done
            
            echo "Batch deleted. Checking for more..."
          done
          
          echo "Cleanup complete."

  validate-hassfest:
    name: ☑️ Validate with hassfest
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: "actions/checkout@v4"
      - name: Run hassfest validation
        uses: "home-assistant/actions/hassfest@master"

  validate-hacs:
    name: ☑️ Validate with HACS
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: "actions/checkout@v4"
      - name: Run HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  release:
    name: ✅ Create Release
    runs-on: ubuntu-latest
    needs: [validate-hassfest, validate-hacs]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    permissions:
      contents: write # Required to create tags and releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to check for existing tags properly

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get version details
        id: get_version
        run: |
          # Get version from manifest
          VERSION=$(jq -r .version custom_components/meinvodafone/manifest.json)
          TAG_NAME="v$VERSION"
          
          # Set environment variables for subsequent steps
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=MeinVF v$VERSION">> $GITHUB_ENV

      - name: Check for existing tag
        id: check_tag
        run: |
          # Check if tag exists remotely
          if git ls-remote --exit-code --tags origin "refs/tags/${{ env.TAG_NAME }}" >/dev/null 2>&1; then
            echo "Tag ${{ env.TAG_NAME }} already exists. Skipping release."
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "Tag ${{ env.TAG_NAME }} does not exist. Proceeding."
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Create and Push Tag
        if: env.SKIP == 'false'
        run: |
          # Configure git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create annotated tag
          git tag -a "${{ env.TAG_NAME }}" -m "${{ env.RELEASE_TITLE }}"
          
          # Push the tag
          git push origin "${{ env.TAG_NAME }}"

      - name: Create Release Body
        if: env.SKIP == 'false'
        run: |
          # Create markdown file for release notes
          cat << EOF > release_body.md
          # 🌀 ›› *${{ env.VERSION }}* released! • 🗿

          <img height="128" alt="image" src="https://raw.githubusercontent.com/Bitte-ein-Git/ha_meinvf/dev/images/vf.png" />
          EOF

      - name: ZIP Component Dir
        if: env.SKIP == 'false'
        run: |
          # Navigate to component directory
          cd ${{ github.workspace }}/custom_components/meinvodafone
          
          # Create zip archive
          zip -r meinvf.zip ./
          
          # Move zip to workspace root
          mv meinvf.zip ${{ github.workspace }}/meinvf.zip

      - name: Create Release
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create GitHub release using the pushed tag
          gh release create ${{ env.TAG_NAME }} \
            --title "${{ env.RELEASE_TITLE }}" \
            --notes-file release_body.md \
            ${{ github.workspace }}/meinvf.zip#meinvf.zip